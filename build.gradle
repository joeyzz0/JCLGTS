plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'net.joeyscobblemon'

base {
    archivesName = 'jcl_gts'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

// Flat layout: every .java file sits next to this file, no folders needed.
sourceSets {
    main {
        java {
            srcDirs = ['.']
            include '*.java'
        }
        resources {
            srcDirs = []
        }
    }
}

processResources {
    from('neoforge.mods.toml') {
        into 'META-INF'
    }
}

neoForge {
    version = '21.1.262'

    runs {
        server {
            server()
            programArguments.add('--nogui')
        }
    }

    mods {
        jcl_gts {
            sourceSet sourceSets.main
        }
    }
}
